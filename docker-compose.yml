services:
  gnomguttan:
    image: ghcr.io/jensmjahle/gnomguttan:latest
    container_name: gnomguttan
    ports:
      - "3001:3001"
    environment:
      PORT: ${PORT:-3001}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB: ${MONGODB_DB:-}
      ALBUM_MEDIA_DIR: ${ALBUM_MEDIA_DIR:-/data/album-media}
      VOCECHAT_HOST: ${VOCECHAT_HOST:-https://chat.gnomguttan.no}
      APP_TITLE: ${APP_TITLE:-Gnomguttan}
      VOCECHAT_BOT_TARGET_GROUP_ID: ${VOCECHAT_BOT_TARGET_GROUP_ID:-}
      VOCECHAT_BOT_API_KEY: ${VOCECHAT_BOT_API_KEY:-}
      JELLYFIN_HOST: ${JELLYFIN_HOST:-}
      JELLYFIN_CLIENT_URL: ${JELLYFIN_CLIENT_URL:-https://kino.gnomguttan.no}
      JELLYFIN_TOKEN: ${JELLYFIN_TOKEN:-}
      BRYGGERI_URL: ${BRYGGERI_URL:-https://bryggeri.gnomguttan.no/}
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-}
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
      HOME_ASSISTANT_ENTITY_ID: ${HOME_ASSISTANT_ENTITY_ID:-}
      HOME_ASSISTANT_LIGHT_ENTITY_ID: ${HOME_ASSISTANT_LIGHT_ENTITY_ID:-}
      VALHEIM_SERVER_ADDRESS: ${VALHEIM_SERVER_ADDRESS:-}
      VALHEIM_SERVER_PASSWORD: ${VALHEIM_SERVER_PASSWORD:-}
      VALHEIM_JOIN_CODE: ${VALHEIM_JOIN_CODE:-}
      VALHEIM_WORLD: ${VALHEIM_WORLD:-}
      VALHEIM_PUBLIC_ADDRESS: ${VALHEIM_PUBLIC_ADDRESS:-}
    volumes:
      # Album originals + thumbnails live here. Persists across redeploys.
      - album-media:/data/album-media
    restart: unless-stopped

volumes:
  album-media:
