name: "Release · Web"

# Builds the web app's Docker image for a new web-v* tag and pushes it to GHCR
# as ghcr.io/<owner>/gnomguttan:v<version> (plus :latest for production
# releases, which docker-compose.yml pulls). Run it from Actions.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (keep = same version, next stage, e.g. alpha -> beta -> production)"
        type: choice
        options:
          - patch
          - minor
          - major
          - keep
        default: patch
      stage:
        description: Release stage
        type: choice
        options:
          - alpha
          - beta
          - production
        default: production
      notes:
        description: Release notes (optional, generated from merged PRs when empty)
        type: string
        required: false
      dry_run:
        description: Only compute and show the next tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-web
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Tag
    uses: ./.github/workflows/create-release.yml
    permissions:
      contents: write
    with:
      prefix: web-v
      # Continues from the last v* release; see scripts/release/next-version.mjs.
      start: 0.7.1
      title: Gnomguttan Web
      bump: ${{ inputs.bump }}
      stage: ${{ inputs.stage }}
      notes: ${{ inputs.notes }}
      dry-run: ${{ inputs.dry_run }}

  build:
    name: Build & push Docker image
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=v${{ env.VERSION }}
            type=raw,value=latest,enable=${{ needs.release.outputs.prerelease != 'true' }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/gnomguttan" \
            -d '{"visibility":"public"}'

  versions:
    name: Version badge
    needs: [release, build]
    uses: ./.github/workflows/record-version.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      app: web
      tag: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
